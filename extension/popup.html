<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 380px;
      padding: 14px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 13px;
      color: #0f1419;
      background: #fff;
    }

    /* Header */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }
    .header h1 { font-size: 15px; font-weight: 700; }
    #syncBtn {
      padding: 5px 12px;
      background: #1d9bf0;
      color: #fff;
      border: none;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }
    #syncBtn:disabled { opacity: 0.6; cursor: default; }

    /* Status line */
    #statusLine { font-size: 11px; color: #536471; margin-bottom: 10px; }

    /* Post cards */
    .post {
      border: 1px solid #eff3f4;
      border-radius: 10px;
      padding: 10px;
      margin-bottom: 8px;
    }
    .post-meta {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 5px;
      flex-wrap: wrap;
    }
    .badge {
      display: inline-block;
      padding: 1px 7px;
      border-radius: 10px;
      font-size: 11px;
      font-weight: 600;
    }
    .badge.pending  { background: #fff3cd; color: #856404; }
    .badge.success  { background: #d1e7dd; color: #0a3622; }
    .badge.failed   { background: #f8d7da; color: #842029; }
    .post-time { font-size: 11px; color: #536471; }
    .post-content {
      font-size: 12px;
      line-height: 1.45;
      word-break: break-word;
      white-space: pre-wrap;
    }
    .post-error { margin-top: 5px; font-size: 11px; color: #842029; }
    .empty { text-align: center; color: #536471; padding: 24px 0; font-style: italic; }
    .post-btn {
      margin-top: 7px;
      padding: 4px 12px;
      background: #1d9bf0;
      color: #fff;
      border: none;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
    }
    .post-btn:disabled { opacity: 0.55; cursor: default; }

    /* Config section */
    .config {
      margin-top: 14px;
      padding-top: 12px;
      border-top: 1px solid #eff3f4;
    }
    .config summary {
      font-size: 12px;
      font-weight: 600;
      color: #536471;
      cursor: pointer;
      user-select: none;
      padding: 2px 0;
    }
    .config-body { margin-top: 8px; }
    label { display: block; font-size: 11px; color: #536471; margin-bottom: 2px; }
    input[type="text"] {
      width: 100%;
      padding: 6px 8px;
      margin-bottom: 8px;
      border: 1px solid #cfd9de;
      border-radius: 6px;
      font-size: 12px;
      font-family: monospace;
    }
    input[type="text"]:focus { outline: none; border-color: #1d9bf0; }
    #saveConfig {
      padding: 5px 12px;
      background: #1d9bf0;
      color: #fff;
      border: none;
      border-radius: 6px;
      font-size: 12px;
      cursor: pointer;
    }
    #saveMsg { font-size: 11px; color: #0a3622; margin-left: 8px; }
  </style>
</head>
<body>
  <div class="header">
    <h1>X Auto-Poster</h1>
    <button id="syncBtn">Sync now</button>
  </div>

  <div id="statusLine">Loading…</div>
  <div id="posts"></div>

  <details class="config">
    <summary>Configuration</summary>
    <div class="config-body">
      <label for="supabaseUrl">Supabase URL</label>
      <input type="text" id="supabaseUrl" placeholder="https://xxxx.supabase.co" />

      <label for="supabaseAnonKey">Supabase Anon Key</label>
      <input type="text" id="supabaseAnonKey" placeholder="eyJ…" />

      <button id="saveConfig">Save</button>
      <span id="saveMsg"></span>
    </div>
  </details>

  <script src="config.js"></script>
  <script src="popup.js"></script>
</body>
</html>
